# Builds, signs and drafts a Files Customization release. Run it from Actions > Release > Run workflow.
# Needs two repository secrets: SIGNING_PFX_BASE64 (the .pfx encoded as base64) and SIGNING_PFX_PASSWORD.
# The package's publisher and version are set on the build machine only; the manifest in the repository stays unchanged.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, for example v4.3-0.2'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025-vs2026
    env:
      CONFIGURATION:         'Release'
      APPX_PACKAGE_DIR:      '${{ github.workspace }}\artifacts\AppxPackages\'
      PACKAGE_DIR:           '${{ github.workspace }}\artifacts\InstallPackage\'
      PACKAGE_MANIFEST_PATH: 'src\Files.App\Package.appxmanifest'
      LAUNCHER_PROJECT_PATH: 'src\Files.App.Launcher\Files.App.Launcher.vcxproj'
      RELEASE_TAG:           '${{ inputs.version }}'

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v6
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Load the certificate and set the package publisher
      shell: pwsh
      run: |
        $certPath = Join-Path $env:RUNNER_TEMP 'signing.pfx'
        [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
        $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($certPath, $env:SIGNING_PFX_PASSWORD)
        [xml]$manifest = Get-Content $env:PACKAGE_MANIFEST_PATH
        $manifest.Package.Identity.Publisher = $cert.Subject
        # Each release gets a higher version, so Windows installs it as an update.
        $version = [version]$manifest.Package.Identity.Version
        $manifest.Package.Identity.Version = "$($version.Major).$($version.Minor).$env:GITHUB_RUN_NUMBER.0"
        $manifest.Save((Resolve-Path $env:PACKAGE_MANIFEST_PATH).Path)
        New-Item -ItemType Directory -Force -Path $env:PACKAGE_DIR | Out-Null
        [IO.File]::WriteAllBytes((Join-Path $env:PACKAGE_DIR 'Files-Customization.cer'), $cert.Export('Cert'))
      env:
        SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
        SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}

    - name: Restore Files
      shell: pwsh
      run: msbuild Files.slnx -t:Restore -p:Platform=x64 -p:Configuration=$env:CONFIGURATION -p:PublishReadyToRun=true -v:quiet

    - name: Restore and build the launcher
      shell: pwsh
      run: |
        nuget restore "$env:LAUNCHER_PROJECT_PATH" -SolutionDirectory "$env:GITHUB_WORKSPACE" -Verbosity detailed
        msbuild "$env:LAUNCHER_PROJECT_PATH" -t:Build -p:Platform=x64 -p:Configuration=$env:CONFIGURATION -v:quiet
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Build & package Files
      shell: pwsh
      run: |
        foreach ($platform in 'x64', 'arm64') {
          msbuild 'src\Files.App\Files.App.csproj' -t:Build -p:Platform=$platform -p:Configuration=$env:CONFIGURATION `
            -p:AppxPackageDir="$env:APPX_PACKAGE_DIR" -p:AppxBundle=Never -p:GenerateAppxPackageOnBuild=true `
            -p:UapAppxPackageBuildMode=Sideload -v:quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Create msixbundle
      shell: pwsh
      run: |
        . './.github/scripts/Create-MsixBundle.ps1' -AppxPackageDir "$env:APPX_PACKAGE_DIR" -BundleName 'Files.Customization' `
          -PackageManifestPath "$env:PACKAGE_MANIFEST_PATH" -BuildMode 'Sideload'

    - name: Remove empty files from the packages
      shell: bash
      run: find "$GITHUB_WORKSPACE/artifacts" -empty -delete

    - name: Sign the bundle and create the zip
      shell: pwsh
      run: |
        $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
          Where-Object { $_.DirectoryName -match '\\x64$' } | Sort-Object FullName -Descending | Select-Object -First 1
        $bundle = Get-ChildItem $env:APPX_PACKAGE_DIR -Recurse -Filter *.msixbundle | Select-Object -First 1
        & $signtool.FullName sign /fd SHA256 /f (Join-Path $env:RUNNER_TEMP 'signing.pfx') /p $env:SIGNING_PFX_PASSWORD `
          /tr http://timestamp.digicert.com /td SHA256 $bundle.FullName
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        # The zip holds the package, its certificate and the dependency packages.
        Copy-Item $bundle.FullName $env:PACKAGE_DIR
        $dependencies = Join-Path $bundle.DirectoryName 'Dependencies'
        if (Test-Path $dependencies) { Copy-Item $dependencies $env:PACKAGE_DIR -Recurse }
        Compress-Archive -Path "$($env:PACKAGE_DIR)*" -DestinationPath (Join-Path $env:RUNNER_TEMP "Files-Customization-$env:RELEASE_TAG.zip")
      env:
        SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}

    - name: Create the draft release
      shell: pwsh
      run: |
        gh release create $env:RELEASE_TAG (Join-Path $env:RUNNER_TEMP "Files-Customization-$env:RELEASE_TAG.zip") --draft `
          --target $env:GITHUB_SHA --title "Files Customization $env:RELEASE_TAG" --notes ''
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      env:
        GH_TOKEN: ${{ github.token }}
